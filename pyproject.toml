[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segclr-subcompartment"
version = "0.1.0"
description = "Portable SegCLR subcompartment models and editable-label experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.6", "scikit-learn>=1.3"]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2", "plotly>=5"]
test = ["pytest>=7"]

[project.scripts]
subcompartment = "subcompartment.cli:main"

[tool.setuptools.packages.find]
include = ["subcompartment*"]
